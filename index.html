<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef"><title>BuyMind · 冷静购买</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#242c2a;background:#f6f4ef}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:48px 20px 90px}.eyebrow{letter-spacing:.16em;color:#64766b;font-size:12px;font-weight:700}h1{font-size:clamp(35px,7vw,60px);letter-spacing:-.05em;margin:10px 0}header p{color:#68716b;line-height:1.8;max-width:570px}.panel{background:#fff;border:1px solid #e3e7df;border-radius:22px;padding:26px;margin-top:24px;box-shadow:0 12px 40px #24382c0b}h2{font-size:19px;margin:0 0 18px}label{display:block;font-weight:650;margin:16px 0 8px}input,textarea,select{width:100%;border:1px solid #d5ddd4;border-radius:11px;padding:12px 14px;background:#fff;font:inherit;color:inherit}textarea{min-height:78px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.question{padding:17px 0;border-bottom:1px solid #e9ece8}.question:last-child{border:0}.question b{display:block;line-height:1.6;margin-bottom:12px}.opts{display:grid;gap:8px}.opt{display:flex;align-items:center;gap:9px;border:1px solid #e1e7df;padding:11px;border-radius:10px;cursor:pointer;font-weight:400;margin:0}.opt:has(input:checked){background:#edf5ef;border-color:#8eae96}.opt input{width:auto;accent-color:#416f53}button{border:0;border-radius:12px;padding:14px 22px;background:#315e44;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e9eee9;color:#2f503d}button:hover{filter:brightness(.95)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.muted{color:#68716b;font-size:13px;line-height:1.7}.hidden{display:none}.verdict{font-size:25px;font-weight:800;margin:10px 0}.score{font-size:13px;color:#566b5d}.report{white-space:pre-wrap;line-height:1.85;background:#f7f9f5;padding:18px;border-radius:12px;margin-top:15px}footer{margin-top:30px;text-align:center;color:#7a847b;font-size:12px}@media(max-width:520px){main{padding-top:28px}.panel{padding:18px}.two{grid-template-columns:1fr}}
</style></head><body><main><header><div class="eyebrow">BUY LESS · CHOOSE BETTER</div><h1>BuyMind <span style="color:#60836b">冷静购买</span></h1><p>折扣很诱人，但你需要的未必是商品。花三分钟回答 11 个问题，区分真正的需求、审美偏好与错失恐惧。答案仅在本页处理，不会上传。</p></header><form id="form"><section class="panel"><h2>01 · 你正在考虑什么？</h2><label for="item">商品名称</label><input id="item" placeholder="例如：一件滑雪外套" required><div class="two"><div><label for="price">到手价 (€)</label><input id="price" type="number" min="0" step=".01" placeholder="89.99" required></div><div><label for="original">标价 / 原价 (€，可选)</label><input id="original" type="number" min="0" step=".01" placeholder="300"></div></div><label for="target">你原本愿意支付的最高价格 (€，可选)</label><input id="target" type="number" min="0" step=".01" placeholder="90"><label for="why">最想买它的理由</label><textarea id="why" placeholder="颜色、功能、折扣，还是担心错过？"></textarea></section><section class="panel"><h2>02 · 购买前的 11 个问题</h2><div id="questions"></div></section><section class="panel"><h2>03 · 给自己一个冷静的结论</h2><p class="muted">这不是消费能力测验，也不是禁止购买。它帮助你发现折扣锚定、重复购买和冲动下单的信号。</p><div class="actions"><button type="submit">生成我的购买评估</button><button type="reset" class="secondary">重新填写</button></div></section></form><section id="result" class="panel hidden" aria-live="polite"><div class="eyebrow">YOUR BUYMIND REPORT</div><div id="verdict" class="verdict"></div><div id="score" class="score"></div><div id="report" class="report"></div><div class="actions"><button id="copy" type="button">复制评估报告</button><button id="again" type="button" class="secondary">修改答案</button></div></section><footer>BuyMind · 理性消费，不等于放弃喜欢。 · 本页不收集或发送填写内容。</footer></main><script>
const questions=[
["如果没有折扣，你还会想买它吗？",["会，我喜欢它本身","可能会，但会犹豫","不会，主要因为折扣"],[2,1,0]],
["你已经有能完成相同任务的东西吗？",["没有，确实缺少","有，但存在明确不足","有，而且已经够用了"],[2,1,0]],
["未来一个月你会实际使用它吗？",["会，已有具体场景","可能会","不确定，暂时想不到"],[2,1,0]],
["这笔钱会影响房租、食物、储蓄或其他必要支出吗？",["不会，预算充足","需要压缩其他可选消费","会影响必要支出"],[2,1,0]],
["你已经喜欢这件商品多久了？",["一个月以上","几天到几周","刚看到或刚发现降价"],[2,1,0]],
["你是否已经检查过自己的衣柜/库存？",["检查过，确有缺口","大致知道有什么","还没有检查"],[2,1,0]],
["如果明天恢复原价，你最遗憾的是什么？",["失去适合自己的商品","两者都有","错过折扣本身"],[2,1,0]],
["商品的尺码、舒适度和实际功能是否明确？",["明确，且适合","大致清楚，有少量疑问","不明确，存在明显风险"],[2,1,0]],
["如果需要退货，你能接受时间和精力成本吗？",["可以，退货条件清楚","可以，但有些麻烦","不愿意或退货困难"],[2,1,0]],
["这次购买是否符合你事先设定的价格上限？",["符合，而且不是临时提高的","接近上限","超出上限或根本没设上限"],[2,1,0]],
["如果现在不买，等待 72 小时会造成实际损失吗？",["会错过明确的必要使用时机","可能有一点不便","不会，只是怕卖完"],[2,1,0]]
];
const qbox=document.getElementById("questions");
questions.forEach((q,i)=>{const div=document.createElement("div");div.className="question";const b=document.createElement("b");b.textContent=(i+1)+". "+q[0];div.append(b);const opts=document.createElement("div");opts.className="opts";q[1].forEach((answer,j)=>{const label=document.createElement("label");label.className="opt";const radio=document.createElement("input");radio.type="radio";radio.name="q"+i;radio.value=j;radio.required=true;label.append(radio,document.createTextNode(answer));opts.append(label)});div.append(opts);qbox.append(div)});
let lastReport="";
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const picks=questions.map((q,i)=>Number(f.querySelector('input[name="q'+i+'"]:checked').value));const score=picks.reduce((sum,p,i)=>sum+questions[i][2][p],0);const item=document.getElementById("item").value.trim();const price=Number(document.getElementById("price").value);const original=Number(document.getElementById("original").value);const targetText=document.getElementById("target").value;const target=targetText===""?null:Number(targetText);const notes=[];if(picks[3]===2)notes.push("预算会影响必要支出：建议不要购买。");else if(picks[3]===1)notes.push("这笔支出会挤占其他消费，请先核对本月预算。");if(picks[1]===2)notes.push("已有同类商品且够用，新增购买主要是偏好而非需求。");if(picks[0]===2||picks[6]===2)notes.push("折扣或错失恐惧正在影响判断，建议暂停浏览促销页面。");if(picks[7]===2)notes.push("尺码或功能仍不明确，先核实再决定。");if(picks[5]===2)notes.push("先检查已有物品，再决定是否需要新增。");if(target!==null&&price>target)notes.push("当前价格超过你预先设定的上限。");if(picks[10]===2)notes.push("等待 72 小时不会造成实际损失。");if(original>price)notes.push("标价优惠约 "+Math.round((1-price/original)*100)+"%，但折扣不等于省钱，只有真正需要才有价值。");let verdict=score>=17?"可以理性考虑":score>=11?"建议冷静 72 小时":"建议暂不购买";if(picks[3]===2||target!==null&&price>target)verdict="建议暂不购买";const summary=notes.length?notes.join("\n• "):"目前没有明显高风险信号。仍建议确认实际使用频率、退货条件和预算。";lastReport="BuyMind · 冷静购买评估\n商品："+item+"\n到手价：€"+price.toFixed(2)+(original>0?"\n标价：€"+original.toFixed(2):"")+(target!==null?"\n预设上限：€"+target.toFixed(2):"")+"\n自述理由："+(document.getElementById("why").value.trim()||"未填写")+"\n\n结果："+verdict+"（"+score+"/22）\n\n需要注意：\n• "+summary+"\n\n最终提醒：价格达标只是重新评估的资格，不是购买义务。";document.getElementById("verdict").textContent=verdict;document.getElementById("score").textContent="自检参考分数："+score+" / 22 · 不是科学测量或财务建议";document.getElementById("report").textContent=lastReport;document.getElementById("result").classList.remove("hidden");document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"})});
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(lastReport);document.getElementById("copy").textContent="已复制"}catch{const ta=document.createElement("textarea");ta.value=lastReport;document.body.append(ta);ta.select();document.execCommand("copy");ta.remove();document.getElementById("copy").textContent="已复制"}};
document.getElementById("again").onclick=()=>document.getElementById("form").scrollIntoView({behavior:"smooth"});
document.getElementById("form").addEventListener("reset",()=>{document.getElementById("result").classList.add("hidden");document.getElementById("copy").textContent="复制评估报告"});
</script></body></html>
