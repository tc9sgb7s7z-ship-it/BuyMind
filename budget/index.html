<script>
(()=>{'use strict';
const KEY='flowplanner-budget-mind-v1';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const thisMonth=()=>today().slice(0,7);const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);const n2=n=>(Number(n)||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));const cents=n=>Math.round((Number(n)||0)*100)/100;const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));const daysInMonth=m=>new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();const dateMonth=d=>String(d||'').slice(0,7);const viewDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('zh-CN',{month:'short',day:'numeric'}):'—';const categories={food:'餐饮',shopping:'衣物购物',game:'游戏充值',fun:'娱乐活动',transport:'交通出行',study:'学习用品',health:'医疗健康',daily:'生活日用',housing:'房租',insurance:'保险',phone:'通讯',subscription:'其他订阅',other:'其他'};const discretionary=['shopping','game','fun'];const necessity=['transport','study','health','daily','other'];const categoryColor={food:'#78c29b',shopping:'#7faed9',game:'#e2a2da',fun:'#f2c879',transport:'#7babae',study:'#b9a7ed',health:'#ee9b92',daily:'#9bb5b6',housing:'#748fa6',insurance:'#7db8ad',phone:'#c0a4d8',subscription:'#d9ac8c',other:'#9cacbb'};
const defaults=()=>({version:2,settings:{foodDaily:12,funMonthly:100,extraBuffer:0,fxCnyPerEur:8.3,theme:'light',gameLimit:30},transactions:[],wishes:[],goals:[],contributions:[],bills:[{id:uid(),name:'房租',amount:640,day:1,category:'housing',active:true},{id:uid(),name:'保险',amount:150,day:1,category:'insurance',active:true},{id:uid(),name:'电话卡',amount:8.95,day:1,category:'phone',active:true}],notes:{}});
function normalize(s){const d=defaults();if(!s||typeof s!=='object'||!s.settings)throw Error('无效数据结构');const o={...d,...s,settings:{...d.settings,...s.settings}};for(const k of ['transactions','wishes','goals','contributions','bills'])if(!Array.isArray(o[k]))o[k]=[];if(!o.notes||typeof o.notes!=='object')o.notes={};return o}
let state;let storageOK=true;try{state=normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){state=defaults();if(e instanceof DOMException)storageOK=false}if((state.version||1)<2){state.settings.theme='light';state.version=2;}let month= thisMonth()==='2026-10'?'2026-11':thisMonth();let page='overview';let toastTimer;let simulation={spent:null,price:65};let editingTx=null;let searchText='';let filterCat='all';let mindFilter='all';let returnFocus=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;document.getElementById('storage-status').textContent='✓ 本地保存已启用'}catch(e){storageOK=false;document.getElementById('storage-status').textContent='⚠ 本地保存不可用，请导出备份';toast('保存失败，请导出 JSON 备份')} }
function toast(message){let e=document.getElementById('toast');e.textContent=message;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2700)}
function setTheme(){document.documentElement.classList.toggle('light',state.settings.theme==='light')}
function transactions(m=month){return state.transactions.filter(t=>dateMonth(t.date)===m)}
function amountInEur(t){return cents(t.amountEur??t.amount)}
function spentFor(cat,m=month){return cents(transactions(m).filter(t=>t.category===cat).reduce((s,t)=>s+(t.type==='refund'?-1:1)*amountInEur(t),0))}
function sumCats(cats,m=month){return cents(cats.reduce((s,c)=>s+spentFor(c,m),0))}
function allExpense(m=month){return cents(transactions(m).reduce((s,t)=>s+(t.type==='refund'?-1:1)*amountInEur(t),0))}
function fixedPlanned(){return cents(state.bills.filter(b=>b.active).reduce((s,b)=>s+Number(b.amount||0),0))}
function activeDays(){return daysInMonth(month)}
function moneyNum(v){const n=Number(v);return Number.isFinite(n)&&n>=0?n:null}
function pageGo(p){page=p;document.querySelectorAll('.panel').forEach(e=>e.classList.toggle('active',e.id===p));document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.page===p));const titles={overview:['我的月度概览','本月预算和支出'],ledger:['消费账本','查看、编辑和导出记录'],food:['餐饮日历','每日餐饮支出'],mind:['购物清单','购买模拟和候选清单'],goals:['愿望基金','储蓄目标与进度'],bills:['固定账单','每月固定费用'],insights:['月度统计','消费统计和月度回顾'],settings:['设置与数据安全','预算设置和数据备份']};document.getElementById('pageTitle').textContent=titles[p][0];document.getElementById('pageSub').textContent=titles[p][1];render();window.scrollTo({top:0,behavior:'instant'})}

function stat(top,val,foot,symbol){return `<div class="card stat"><div class="top"><span>${top}</span><span class="symbol">${symbol}</span></div><div class="value">${val}</div><div class="foot">${foot}</div></div>`}
function overview(){const fixed=fixedPlanned(),food=spentFor('food'),fun=sumCats(discretionary),plannedFood=state.settings.foodDaily*activeDays(),limit=Number(state.settings.funMonthly),paidBills=transactions().filter(t=>t.billId&&t.type!=='refund').length,spent=allExpense(),extra=sumCats(necessity);const day=today();const dInMonth=month===thisMonth()?Number(day.slice(8)):month<thisMonth()?activeDays():0;const idealLimit=limit*dInMonth/activeDays();const remaining=limit-fun;const gameSpent=spentFor('game');const gameLimit=Number(state.settings.gameLimit||0);const allPlanned=fixed+plannedFood+limit+Number(state.settings.extraBuffer||0);let topNotice=fun>limit?`自由消费超出 ${euro(fun-limit)}。`:fun>idealLimit&&dInMonth>0?`自由消费高于当前进度参考值 ${euro(idealLimit)}。`:'自由消费未超额。';
return `<div class="grid g4">${stat('本月计划总额',euro(allPlanned),'固定 + 餐饮 + 自由 + 预留','◈')}${stat('自由消费剩余',euro(remaining),`已用 ${euro(fun)} / ${euro(limit)}`,'♡')}${stat('餐饮剩余',euro(plannedFood-food),`日均 ${euro(state.settings.foodDaily)} · ${activeDays()} 天`,'◷')}${stat('实际净支出',euro(spent),`已确认账单 ${paidBills} 笔 · 额外必要支出 ${euro(extra)}`,'▤')}</div><div class="spacer"></div><div class="split"><div class="card"><div class="between"><h3>本月预算进度</h3><span class="tag">${esc(month)}</span></div><div class="between"><span>自由消费</span><b>${euro(fun)} / ${euro(limit)}</b></div>${progress(fun,limit)}<div class="between small muted"><span>本月剩余 ${euro(remaining)}</span><span>${limit?Math.round(fun/limit*100):0}%</span></div><hr class="divider"><div class="between"><span>餐饮累计</span><b>${euro(food)} / ${euro(plannedFood)}</b></div>${progress(food,plannedFood)}<div class="between small muted"><span>当月共 ${activeDays()} 天</span><span>${plannedFood?Math.round(food/plannedFood*100):0}%</span></div><hr class="divider"><div class="between"><span>固定账单计划</span><b>${euro(fixed)}</b></div><p class="hint">固定账单确认支付后才计入实际支出。</p><div class="notice ${fun>limit?'warn':''}">${topNotice}${gameSpent>gameLimit?`<br><strong>游戏充值：</strong>已花 ${euro(gameSpent)}，高于子限额 ${euro(gameLimit)}。`:``}</div></div><div class="card"><div class="between"><h3>买之前 · 快速模拟</h3><button class="btn tiny" data-jump="mind">查看购物清单 →</button></div><div class="field"><label for="simPriceO">想买的商品价格（EUR）</label><input type="number" id="simPriceO" min="0" step="0.01" value="${simulation.price}"></div><div class="spacer"></div><div id="simOutO"></div><p class="hint">模拟金额不会记账。</p><button class="btn" data-jump="mind">放进冷静清单</button></div></div><div class="spacer"></div><div class="split"><div class="card"><div class="between"><h3>最近交易</h3><button class="btn tiny" data-jump="ledger">查看全部 →</button></div>${recentRows()}</div><div class="card"><div class="between"><h3>我的购买候选</h3><button class="btn tiny" data-jump="mind">管理清单 →</button></div>${state.wishes.filter(w=>w.status==='waiting').slice(0,4).map(w=>`<div class="minirow"><div><b>${esc(w.name)}</b><div class="hint">${cooldownText(w)} · ${viewDate(w.created.slice(0,10))}</div></div><b>${euro(w.priceEur)}</b></div>`).join('')||'<div class="empty">暂时没有待冷静的商品</div>'}</div></div>`}
function recentRows(){const t=transactions().slice().sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,6);return t.length?t.map(t=>`<div class="minirow"><div><b>${esc(t.name||categories[t.category]||'消费')}</b><div class="hint">${viewDate(t.date)} · ${esc(categories[t.category]||t.category)}</div></div><div class="amount ${t.type==='refund'?'positive':''}">${t.type==='refund'?'+':'−'}${euro(amountInEur(t))}</div></div>`).join(''):'<div class="empty">还没有交易，点击右上角「记一笔」开始。</div>'}
function simulator(p){const limit=Number(state.settings.funMonthly),fun=sumCats(discretionary),price=cents(Number(p)||0),remaining=cents(limit-fun-price);return `<div class="grid g2"><div class="listcard"><span class="small muted">当前剩余</span><div class="kpi">${euro(limit-fun)}</div></div><div class="listcard"><span class="small muted">假设购买后</span><div class="kpi ${remaining<0?'color-danger':'color-accent'}">${euro(remaining)}</div></div></div>${progress(fun+price,limit)}<div class="notice ${remaining<0?'warn':''}">${remaining<0?`超出预算 ${euro(-remaining)}。`:`购买后剩余 ${euro(remaining)}。`}</div>`}
function renderSim(){const p=document.getElementById('simPriceO');const o=document.getElementById('simOutO');if(p&&o)o.innerHTML=simulator(p.value)}
function renderLedger(){let opts='<option value="all">全部类别</option>'+Object.entries(categories).map(([id,name])=>`<option value="${id}" ${filterCat===id?'selected':''}>${name}</option>`).join('');const f=document.getElementById('txFilter');if(f)f.innerHTML=opts;const input=document.getElementById('txSearch');if(input)input.value=searchText;let rows=transactions().filter(t=>(filterCat==='all'||filterCat===t.category)&&(`${t.name||''} ${t.note||''} ${categories[t.category]||''}`.toLowerCase().includes(searchText.toLowerCase()))).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));document.getElementById('ledgerContent').innerHTML=rows.length?`<div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>名称 / 备注</th><th>类别</th><th>原始金额</th><th>折算 EUR</th><th class="right">操作</th></tr></thead><tbody>${rows.map(t=>`<tr><td class="nowrap">${viewDate(t.date)}</td><td><b>${esc(t.name||'未命名')}</b><div class="tiny muted">${esc(t.note||'')}${t.billId?' · 已确认账单':''}</div></td><td><span class="tag">${esc(categories[t.category]||t.category)}</span>${t.type==='refund'?'<span class="tag good">退款</span>':''}</td><td>${t.type==='refund'?'+':'−'}${t.currency==='CNY'?'¥':'€'}${n2(t.amount)} ${esc(t.currency||'EUR')}</td><td class="amount ${t.type==='refund'?'positive':''}">${t.type==='refund'?'+':'−'}${euro(amountInEur(t))}</td><td class="right"><button class="btn tiny" data-edit-tx="${esc(t.id)}">编辑</button> <button class="btn tiny danger" data-delete-tx="${esc(t.id)}">删除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">这个月份没有符合条件的交易。</div>';}
function renderFood(){const daily=Number(state.settings.foodDaily),limit=daily*activeDays(),spent=spentFor('food'),dt=new Date(Number(month.slice(0,4)),Number(month.slice(5,7))-1,1),offset=(dt.getDay()+6)%7;const days=Array.from({length:activeDays()},(_,i)=>{const day=String(i+1).padStart(2,'0'),date=month+'-'+day,spentDay=cents(transactions().filter(t=>t.date===date&&t.category==='food').reduce((s,t)=>s+(t.type==='refund'?-1:1)*amountInEur(t),0));return `<div class="day ${spentDay>daily?'over':''} ${date===today()?'today':''}" title="${esc(date)} · ${euro(spentDay)}"><div class="num">${i+1}</div><div class="e ${spentDay>daily?'color-warn':''}">${spentDay?euro(spentDay):'—'}</div></div>`});const cells=Array(offset).fill('<div></div>').concat(days);const elapsed=month===thisMonth()?Number(today().slice(8)):month<thisMonth()?activeDays():0;const budgetToDate=elapsed*daily;document.getElementById('foodContent').innerHTML=`<div class="grid g3">${stat('本月餐饮预算',euro(limit),`${activeDays()} 天 × ${euro(daily)}`,'◷')}${stat('累计餐饮支出',euro(spent),`已记录 ${transactions().filter(t=>t.category==='food').length} 笔`,'▤')}${stat('累计预算差额',euro(budgetToDate-spent),`截至第 ${elapsed} 天的参考值`,'◎')}</div><div class="spacer"></div><div class="card"><div class="between wrap"><h3>${esc(month)} · 餐饮日历</h3><button class="btn" data-add-cat="food">＋ 记录餐饮</button></div><div class="daygrid">${['一','二','三','四','五','六','日'].map(v=>`<div class="day heading">周${v}</div>`).join('')}${cells.join('')}</div><div class="spacer"></div><div class="notice">以整月累计金额为准。「—」表示当天没有记录。</div></div>`}
function cooldownText(w){const ms=Number(w.waitHours||72)*3600000-(Date.now()-new Date(w.created).getTime());if(!Number.isFinite(ms))return '等待状态未知';if(ms<=0)return '冷静期已结束';return `还需 ${Math.ceil(ms/3600000)} 小时`}
function renderMind(){const fun=sumCats(discretionary),limit=Number(state.settings.funMonthly);const wishes=state.wishes.filter(w=>mindFilter==='all'||w.status===mindFilter).sort((a,b)=>b.created.localeCompare(a.created));const items=wishes.map(w=>{const waitOver=Date.now()>=new Date(w.created).getTime()+Number(w.waitHours||72)*3600000;return `<div class="listcard"><div class="between"><h4>${esc(w.name)}</h4><b>${euro(w.priceEur)}</b></div><div class="meta"><span class="tag ${w.status==='waiting'?(waitOver?'good':'warn'):''}">${w.status==='waiting'?(waitOver?'可重新评估':'冷静中'):w.status==='bought'?'已购买':'已放弃'}</span><span class="tag">${cooldownText(w)}</span>${w.targetPrice?`<span class="tag">目标价 ${euro(w.targetPrice)}</span>`:''}</div>${w.reason?`<div class="hint">购买理由：${esc(w.reason)}</div>`:''}${w.url?`<div class="hint"><a target="_blank" rel="noopener noreferrer" href="${safeUrl(w.url)}">查看商品链接</a></div>`:''}<div class="buttons">${w.status==='waiting'?`<button class="btn tiny" data-wish="review:${esc(w.id)}">重新评估</button><button class="btn tiny" data-wish="bought:${esc(w.id)}">标记买入</button><button class="btn tiny" data-wish="skipped:${esc(w.id)}">放弃</button>`:''}<button class="btn tiny danger" data-wish="delete:${esc(w.id)}">移除</button></div></div>`}).join('');document.getElementById('mindContent').innerHTML=`<div class="split"><div class="card"><h3>购买前预算模拟</h3><div class="field"><label for="simPriceM">商品价格（EUR）</label><input id="simPriceM" type="range" min="0" max="300" step="5" value="${simulation.price}" aria-label="模拟商品价格"></div><div class="between"><input type="number" id="simNumberM" class="btn" style="width:150px" min="0" step="0.01" value="${simulation.price}" aria-label="精确填写商品价格"><span class="hint">自由预算已用 ${euro(fun)} / ${euro(limit)}</span></div><div class="spacer"></div><div id="simOutM">${simulator(simulation.price)}</div><div class="form-actions"><button class="btn primary" id="wishlistQuick">加入冷静清单</button></div></div><div class="card"><h3>购买前检查</h3><div class="checklist"><label><input type="checkbox" class="mindCheck">我已经确认现有物品无法满足需求</label><label><input type="checkbox" class="mindCheck">如果没有折扣或限时活动，我仍然愿意买</label><label><input type="checkbox" class="mindCheck">这次购买不会突破自己设定的自由预算</label><label><input type="checkbox" class="mindCheck">我愿意等 72 小时，再重新做决定</label></div><hr class="divider"><div class="notice">这些问题只是帮助判断，不给购买行为打道德分数。冷静期结束也不代表必须购买。</div><div class="spacer"></div><p class="hint">你也可以使用原有 BuyMind 自检。两个工具的数据不会自动互通。</p></div></div><div class="spacer"></div><div class="between wrap"><h3 style="margin:0">购物冷静清单</h3><div class="flex wrap"><select id="wishFilter" class="btn" aria-label="筛选心愿状态"><option value="all" ${mindFilter==='all'?'selected':''}>全部</option><option value="waiting" ${mindFilter==='waiting'?'selected':''}>待决定</option><option value="bought" ${mindFilter==='bought'?'selected':''}>已购买</option><option value="skipped" ${mindFilter==='skipped'?'selected':''}>已放弃</option></select><button class="btn" id="addWish">＋ 添加商品</button></div></div><div class="spacer"></div><div class="grid g2">${items||'<div class="empty">清单还是空的。把想买的东西先放进来，等待几天再决定。</div>'}</div>`}

function renderGoals(){document.getElementById('goalsContent').innerHTML=state.goals.length?state.goals.map(g=>{const saved=cents(state.contributions.filter(c=>c.goalId===g.id).reduce((s,c)=>s+c.amount,0));return `<div class="card"><div class="between"><h3>${esc(g.name)}</h3><span class="tag">目标 ${euro(g.target)}</span></div><div class="kpi">${euro(saved)} <span class="hint">/ ${euro(g.target)}</span></div>${progress(saved,g.target)}<div class="between small muted"><span>完成 ${g.target?Math.round(saved/g.target*100):0}%</span><span>${g.deadline?'希望日期 '+esc(g.deadline):'无截止时间'}</span></div><hr class="divider"><div class="between wrap"><span class="hint">还差 ${euro(Math.max(0,g.target-saved))}</span><div class="flex wrap"><button class="btn tiny" data-goal="history:${esc(g.id)}">明细</button><button class="btn tiny primary" data-goal="add:${esc(g.id)}">存入 / 取出</button><button class="btn tiny danger" data-goal="delete:${esc(g.id)}">删除</button></div></div></div>`}).join(''):'<div class="empty">还没有储蓄目标。可以为 MacBook、旅行或其他心愿建立基金。</div>'}

function renderInsights(){const tx=transactions(),total=allExpense(),cats=Object.entries(categories).map(([key,label])=>({key,label,amount:spentFor(key),color:categoryColor[key]})).filter(c=>Math.abs(c.amount)>0.005).sort((a,b)=>b.amount-a.amount);const positive=cats.filter(c=>c.amount>0),positiveTotal=positive.reduce((s,c)=>s+c.amount,0);const weeks=[0,0,0,0,0];for(const t of tx){const i=Math.min(4,Math.floor((Number(t.date.slice(8))-1)/7));weeks[i]+=(t.type==='refund'?-1:1)*amountInEur(t)}const max=Math.max(1,...weeks);document.getElementById('insightsContent').innerHTML=`<div class="grid g3">${stat('本月实际净支出',euro(total),`${tx.length} 笔交易（已扣除退款）`,'▥')}${stat('自由消费占比',`${total>0?Math.round(sumCats(discretionary)/total*100):0}%`,'占已记录净支出的比例','♡')}${stat('餐饮日均',euro(spentFor('food')/Math.max(1,month===thisMonth()?Number(today().slice(8)):month<thisMonth()?activeDays():1)),'按已过天数计算','◷')}</div><div class="spacer"></div><div class="split"><div class="card"><h3>各分类支出</h3>${positive.length?positive.map(c=>`<div style="margin-bottom:13px"><div class="between small"><span><i class="dot" style="background:${c.color}"></i>${esc(c.label)}</span><b>${euro(c.amount)}</b></div><div class="progress"><span style="background:${c.color};width:${clamp(c.amount/Math.max(positiveTotal,1)*100,0,100)}%"></span></div></div>`).join(''):'<div class="empty">暂无统计数据</div>'}<p class="hint">分类比例以所有正向净支出之和为基数；若出现异常退款，统计可能与总净支出不同。</p></div><div class="card"><h3>每周实际净支出</h3><div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));height:215px;align-items:end;gap:8px">${weeks.map((v,i)=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:8px"><span class="tiny muted">${euro(v)}</span><div style="height:${Math.max(5,Math.abs(v)/max*150)}px;width:min(100%,45px);background:${v>=0?'var(--accent2)':'var(--danger)'};border-radius:7px 7px 2px 2px"></div><span class="tiny muted">第${i+1}周</span></div>`).join('')}</div><hr class="divider"><div class="notice">统计仅基于你录入或确认的交易；未录入的现金消费不会自动出现。</div></div></div><div class="spacer"></div><div class="card"><h3>月度回顾</h3><div class="field"><label for="monthNote">记录一下本月最满意的消费、冲动购物诱因，或下一月的调整想法</label><textarea id="monthNote" rows="5" placeholder="例如：某件衣服虽然打折，但我已经有相似的外套。">${esc(state.notes[month]||'')}</textarea></div><div class="form-actions"><button class="btn primary" id="saveMonthNote">保存月度复盘</button></div></div>`}

function openModal(title,body){returnFocus=document.activeElement;document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden';document.querySelector('#modalBody input,#modalBody select,#modalBody button')?.focus()}
function closeModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';returnFocus?.focus?.()}
function txModal(cat='food',id=null){const t=id?state.transactions.find(t=>t.id===id):null;editingTx=id;openModal(t?'编辑交易':'新增交易',`<form id="txForm"><div class="formgrid"><div class="field"><label>日期</label><input name="date" type="date" required value="${esc(t?.date|| (month===thisMonth()?today():month+'-01'))}"></div><div class="field"><label>类型</label><select name="type"><option value="expense" ${t?.type!=='refund'?'selected':''}>支出</option><option value="refund" ${t?.type==='refund'?'selected':''}>退款</option></select></div><div class="field"><label>交易名称</label><input name="name" required maxlength="80" placeholder="例如：午餐 / 超市 / 游戏充值" value="${esc(t?.name||'')}"></div><div class="field"><label>消费类别</label><select name="category">${Object.entries(categories).map(([v,label])=>`<option value="${v}" ${(t?.category||cat)===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label>金额（正数）</label><input name="amount" type="number" required min="0.01" step="0.01" value="${t?t.amount:''}" placeholder="0.00"></div><div class="field"><label>货币</label><select name="currency"><option value="EUR" ${t?.currency!=='CNY'?'selected':''}>EUR · 欧元</option><option value="CNY" ${t?.currency==='CNY'?'selected':''}>CNY · 人民币</option></select></div></div><div class="field" style="margin-top:13px"><label>备注（选填）</label><textarea name="note" maxlength="500">${esc(t?.note||'')}</textarea></div><p class="hint">人民币交易将按当前手动汇率折算，保存后保留当时欧元金额。</p><div class="form-actions"><button type="submit" class="btn primary">${t?'保存修改':'确认记账'}</button><button type="button" class="btn" data-close>取消</button></div></form>`)}
function wishModal(){openModal('添加购物冷静清单',`<form id="wishForm"><div class="formgrid"><div class="field"><label>商品 / 服务名称</label><input name="name" required maxlength="100" placeholder="例如：MacBook Air"></div><div class="field"><label>参考价格 EUR</label><input name="priceEur" type="number" required min="0" step="0.01" value="${simulation.price}"></div><div class="field"><label>心理目标价 EUR</label><input name="targetPrice" type="number" min="0" step="0.01" placeholder="选填"></div><div class="field"><label>冷静等待时间</label><select name="waitHours"><option value="24">24 小时</option><option value="72" selected>72 小时</option><option value="168">7 天</option><option value="336">14 天</option></select></div></div><div class="field" style="margin-top:13px"><label>商品链接（选填）</label><input name="url" type="url" placeholder="https://..."></div><div class="field" style="margin-top:13px"><label>购买理由（选填）</label><textarea name="reason" maxlength="500"></textarea></div><div class="form-actions"><button class="btn primary" type="submit">加入清单</button><button class="btn" type="button" data-close>取消</button></div></form>`)}
function goalModal(){openModal('新增储蓄目标',`<form id="goalForm"><div class="field"><label>目标名称</label><input name="name" maxlength="100" required placeholder="例如：MacBook Air 基金"></div><div class="formgrid" style="margin-top:13px"><div class="field"><label>目标金额 EUR</label><input name="target" type="number" min="0.01" step="0.01" required></div><div class="field"><label>期望完成日期（选填）</label><input name="deadline" type="date"></div></div><div class="form-actions"><button class="btn primary" type="submit">创建目标</button><button class="btn" data-close type="button">取消</button></div></form>`)}
function contributionModal(id){const g=state.goals.find(g=>g.id===id);if(!g)return;openModal('基金存入 / 取出：'+g.name,`<form id="contribForm" data-id="${esc(id)}"><div class="formgrid"><div class="field"><label>金额 EUR（存入正数，取出负数）</label><input name="amount" required type="number" step="0.01" placeholder="例如：50 或 -20"></div><div class="field"><label>日期</label><input name="date" type="date" required value="${today()}"></div></div><div class="field" style="margin-top:13px"><label>备注</label><input name="note" maxlength="200" placeholder="选填"></div><div class="form-actions"><button class="btn primary" type="submit">保存划拨</button><button class="btn" type="button" data-close>取消</button></div></form>`)}
function billModal(id){const b=state.bills.find(v=>v.id===id);openModal(b?'编辑账单':'新增固定账单',`<form id="billForm" data-id="${esc(id||'')}"><div class="formgrid"><div class="field"><label>账单名称</label><input name="name" maxlength="100" required value="${esc(b?.name||'')}"></div><div class="field"><label>金额 EUR</label><input name="amount" type="number" min="0.01" step="0.01" required value="${esc(b?.amount??'')}"></div><div class="field"><label>每月扣费日（1-31）</label><input name="day" type="number" min="1" max="31" step="1" required value="${b?.day||1}"></div><div class="field"><label>分类</label><select name="category">${Object.entries(categories).map(([c,l])=>`<option value="${c}" ${b?.category===c?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>状态</label><select name="active"><option value="1" ${b?.active!==false?'selected':''}>启用</option><option value="0" ${b?.active===false?'selected':''}>暂停</option></select></div></div><div class="form-actions"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" data-close>取消</button></div></form>`)}
function confirmAction(message){return window.confirm(message)}
function download(name,body,type){const blob=new Blob([body],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){download('FlowPlanner_Budget_Backup_'+today()+'.json',JSON.stringify({app:'FlowPlanner Budget & Mind',exportedAt:new Date().toISOString(),data:state},null,2),'application/json;charset=utf-8');toast('已导出完整 JSON 备份')}
function asCSV(rows){const head=['id','日期','类型','名称','类别','原币种','原金额','欧元折算','备注','关联账单ID'];const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '\ufeff'+[head,...rows.map(t=>[t.id,t.date,t.type,t.name,categories[t.category]||t.category,t.currency,t.amount,amountInEur(t),t.note,t.billId||''])].map(row=>row.map(cell).join(',')).join('\r\n')}
function exportCSV(all=false){download('FlowPlanner_Transactions_'+(all?'All':month)+'.csv',asCSV(all?state.transactions:transactions()),'text/csv;charset=utf-8');toast('已导出交易 CSV')}
function handleImport(file){const reader=new FileReader();reader.onload=()=>{try{const text=String(reader.result);if(text.length>10_000_000)throw Error('备份文件过大');const parsed=JSON.parse(text);const incoming=normalize(parsed.data||parsed);const count=incoming.transactions.length;if(!confirmAction(`读取到 ${count} 笔交易。确定导入吗？\n确定=替换当前全部数据，取消=不导入。导入前建议先备份当前数据。`))return;state=incoming;save();setTheme();closeModal();render();toast('已恢复备份数据')}catch(err){alert('导入失败：'+err.message)}};reader.readAsText(file)}
function handlers(){document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)pageGo(b.dataset.page)});document.getElementById('quickAdd').onclick=()=>txModal('food');document.getElementById('monthInput').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){month=e.target.value;render()}};function moveMonth(n){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}document.getElementById('prevMonth').onclick=()=>moveMonth(-1);document.getElementById('nextMonth').onclick=()=>moveMonth(1);document.getElementById('closeModal').onclick=closeModal;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();txModal('food')}});
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset; if(id.close!==undefined){closeModal();return}if(id.jump){pageGo(id.jump);return}if(id.addCat){txModal(id.addCat);return}if(id.editTx){txModal('food',id.editTx);return}if(id.deleteTx){if(confirmAction('确定删除这笔交易吗？此操作无法撤销。')){state.transactions=state.transactions.filter(t=>t.id!==id.deleteTx);save();render();toast('已删除记录')}return}if(id.wish){const [act,wid]=id.wish.split(':');const w=state.wishes.find(v=>v.id===wid);if(!w)return;if(act==='delete'){if(confirmAction('确定移除这项购物候选吗？'))state.wishes=state.wishes.filter(v=>v.id!==wid)}else if(act==='review'){simulation.price=w.priceEur;pageGo('mind');toast('已经更新预算模拟金额，可重新评估')}else if(act==='bought'){if(confirmAction('确认已经购买？将标记为已购买，但不会自动记账；请在实际付款后另行记账。'))w.status='bought'}else if(act==='skipped')w.status='skipped';save();render();return}if(id.goal){const [act,gid]=id.goal.split(':');const g=state.goals.find(x=>x.id===gid);if(!g)return;if(act==='add')contributionModal(gid);if(act==='history'){const rows=state.contributions.filter(x=>x.goalId===gid).sort((a,b)=>b.date.localeCompare(a.date));openModal(g.name+' · 划拨记录',rows.length?`<div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>金额</th><th>备注</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${euro(r.amount)}</td><td>${esc(r.note||'')}</td><td><button class="btn tiny danger" data-remove-contrib="${esc(r.id)}">删除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">没有划拨记录</div>')}if(act==='delete'&&confirmAction('删除储蓄目标及全部划拨记录？此操作无法撤销。')){state.goals=state.goals.filter(x=>x.id!==gid);state.contributions=state.contributions.filter(x=>x.goalId!==gid);save();render()}return}if(id.removeContrib){if(confirmAction('删除此基金划拨记录？')){state.contributions=state.contributions.filter(x=>x.id!==id.removeContrib);save();closeModal();render()}return}if(id.bill){const [act,bid]=id.bill.split(':');const bill=state.bills.find(x=>x.id===bid);if(!bill)return;if(act==='edit')billModal(bid);if(act==='delete'&&confirmAction('确定删除固定账单配置？既有交易记录不会被删除。')){state.bills=state.bills.filter(x=>x.id!==bid);save();render()}if(act==='pay'){if(transactions().some(t=>t.billId===bid&&t.type!=='refund')){toast('这个月已经确认过该账单');return}if(confirmAction(`确认 ${month} 已支付「${bill.name}」${euro(bill.amount)}？请确保没有重复手动记账。`)){const date=month+'-'+String(Math.min(bill.day,daysInMonth(month))).padStart(2,'0');state.transactions.push({id:uid(),date,name:bill.name,category:bill.category,type:'expense',currency:'EUR',amount:bill.amount,amountEur:bill.amount,note:'固定账单确认',billId:bid});save();render();toast('已确认并记入账本')}}return}
switch(b.id){case'addWish':case'wishlistQuick':wishModal();break;case'addGoal':goalModal();break;case'addBill':billModal(null);break;case'exportJSON':exportJSON();break;case'importJSON':document.getElementById('importFile').click();break;case'exportCSV':exportCSV(false);break;case'exportAllCSV':exportCSV(true);break;case'saveMonthNote':state.notes[month]=document.getElementById('monthNote').value;save();toast('已保存月度复盘');break;case'resetData':if(confirmAction('确定要永久清空所有记录和设置吗？建议先导出备份。')&&confirmAction('最后确认：此操作无法撤销。')){state=defaults();save();setTheme();render();toast('已恢复初始状态')}break;default:break}});
document.body.addEventListener('input',e=>{if(e.target.id==='simPriceO'){simulation.price=cents(e.target.value);renderSim()}if(e.target.id==='simPriceM'||e.target.id==='simNumberM'){let val=cents(Math.max(0,Number(e.target.value)||0));simulation.price=val;const range=document.getElementById('simPriceM'),num=document.getElementById('simNumberM');if(range&&e.target!==range)range.value=String(clamp(val,0,300));if(num&&e.target!==num)num.value=String(val);document.getElementById('simOutM').innerHTML=simulator(val)}if(e.target.id==='txSearch'){searchText=e.target.value;renderLedger();const i=document.getElementById('txSearch');i.focus();i.setSelectionRange(searchText.length,searchText.length)}});
document.body.addEventListener('change',e=>{if(e.target.id==='txFilter'){filterCat=e.target.value;renderLedger()}if(e.target.id==='wishFilter'){mindFilter=e.target.value;renderMind()}});
document.body.addEventListener('submit',e=>{const form=e.target;if(!['txForm','wishForm','goalForm','contribForm','billForm','settingsForm'].includes(form.id))return;e.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form);const value=k=>String(fd.get(k)||'').trim();if(form.id==='txForm'){const amount=moneyNum(value('amount')),currency=value('currency'),category=value('category'),date=value('date');if(amount===null||amount<=0||!categories[category]||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!['EUR','CNY'].includes(currency))return alert('请检查金额、日期、货币和类别');const original=editingTx?state.transactions.find(t=>t.id===editingTx):null;const amountEur=currency==='CNY'?cents(amount/Number(state.settings.fxCnyPerEur)):cents(amount);const item={id:original?.id||uid(),date,name:value('name'),type:value('type'),category,currency,amount,amountEur,note:value('note'),...(original?.billId?{billId:original.billId}:{})};if(original)state.transactions=state.transactions.map(t=>t.id===editingTx?item:t);else state.transactions.push(item);closeModal();save();render();toast(original?'已更新交易':'已记入账本')}else if(form.id==='wishForm'){const price=moneyNum(value('priceEur'));if(price===null)return;state.wishes.unshift({id:uid(),name:value('name'),priceEur:price,targetPrice:value('targetPrice')?Number(value('targetPrice')):null,waitHours:Number(value('waitHours')),reason:value('reason'),url:value('url'),status:'waiting',created:new Date().toISOString()});closeModal();save();render();toast('已加入冷静清单')}else if(form.id==='goalForm'){state.goals.push({id:uid(),name:value('name'),target:Number(value('target')),deadline:value('deadline')});closeModal();save();render();toast('目标已创建')}else if(form.id==='contribForm'){const amount=Number(value('amount'));if(!Number.isFinite(amount)||amount===0)return alert('输入非零金额');const gid=form.dataset.id;const g=state.goals.find(x=>x.id===gid);const total=state.contributions.filter(c=>c.goalId===gid).reduce((s,c)=>s+c.amount,0);if(total+amount<-.001)return alert('取出金额不能超过当前基金余额');state.contributions.push({id:uid(),goalId:gid,amount:cents(amount),date:value('date'),note:value('note')});closeModal();save();render();toast('已更新基金余额')}else if(form.id==='billForm'){const data={name:value('name'),amount:Number(value('amount')),day:Number(value('day')),category:value('category'),active:value('active')==='1'};const id=form.dataset.id;if(id){state.bills=state.bills.map(b=>b.id===id?{...b,...data}:b)}else state.bills.push({id:uid(),...data});closeModal();save();render();toast('账单已保存')}else if(form.id==='settingsForm'){for(const k of ['foodDaily','funMonthly','extraBuffer','gameLimit','fxCnyPerEur']){const v=moneyNum(value(k));if(v===null||(k==='fxCnyPerEur'&&v<=0))return alert('请检查预算和汇率');state.settings[k]=v}state.settings.theme=value('theme');save();setTheme();render();toast('设置已保存')}});
document.getElementById('importFile').onchange=e=>{const file=e.target.files?.[0];if(file)handleImport(file);e.target.value=''};
}
try{setTheme();handlers();save();render()}catch(e){console.error(e);document.getElementById('pageTitle').textContent='初始化失败';document.getElementById('pageSub').textContent='请打开浏览器开发者控制台查看错误，并尝试下载新副本。'}
})();
</script>
</body>
